[run]
name = "train_50m"
seed = 1337
device = "cuda"

[data]
train = "data/tinystories_train_50M.txt"
valid = "data/tinystories_valid_14M.txt"

[model]
context_length = 1024
d_model = 256
num_layers = 6
num_heads = 8
d_ff = 768
rope_theta = 10000.0

[optim]
max_steps = 3000
batch_size = 8
grad_accum = 2
seq_len = 256
lr = 1.0e-3
weight_decay = 0.01
eta_min = 1.0e-4
grad_clip = 1.0
val_interval = 200
val_batches = 20
checkpoint = "checkpoints/model.pt"
